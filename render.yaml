# Déploiement HadjChanges sur Render — API et tableau de bord, en plan GRATUIT.
#
# Render le lit et crée les deux services d'un coup (Blueprint). Les valeurs
# marquées `sync: false` sont volontairement absentes : ce sont des secrets, ils
# se saisissent dans l'interface Render et n'ont rien à faire dans un dépôt.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ CE QUE LE PLAN GRATUIT IMPLIQUE — à connaître avant de s'en étonner
#
# 1. LA BASE N'EST PAS CHEZ RENDER, ET C'EST VOULU. Le PostgreSQL gratuit de
#    Render EXPIRE au bout de 90 jours et emporte les données avec lui : c'est
#    ce qui a mis PREVENTIX 360 hors service. `DATABASE_URL` pointe donc vers le
#    projet SUPABASE (région Francfort), qui ne s'autodétruit pas.
#    ⚠️ Le forfait gratuit Supabase met le projet en pause après ~7 jours sans
#    activité, avec reprise MANUELLE — voir deploy/vps/garder-actif.sh.
#
# 2. LE SERVICE S'ENDORT après ~15 min sans trafic, et met ~50 s à se réveiller.
#    Conséquences vécues par l'utilisateur : la première requête après une
#    pause est très lente, et les WebSockets du suivi temps réel sont COUPÉS
#    pendant la veille. Le mobile se reconnecte seul et recharge ses données à
#    la reconnexion (`useTransactionUpdates`) — sans quoi un statut changé
#    pendant la veille serait perdu sans que rien ne le signale.
#
# 3. LE DISQUE EST ÉPHÉMÈRE. Tout fichier écrit localement disparaît à chaque
#    redéploiement ET à chaque réveil. Le stockage S3 externe n'est donc pas une
#    option de confort : sans lui, les pièces d'identité et les reçus déposés
#    par les clients seraient PERDUS. Cloudflare R2 offre 10 Go gratuits.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ────────────────────────────────────────────────────────────────── API ──
  - type: web
    name: hadjchanges-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase — les DEUX chaînes viennent du bouton « Connect », et chez
      # Supabase elles se distinguent par le PORT, pas par un fragment.
      #
      #   DATABASE_URL → « Transaction pooler », port 6543, + ?pgbouncer=true
      #   DIRECT_URL   → « Session pooler »,     port 5432
      #
      # ⚠️ NE PAS prendre « Direct connection » (db.<ref>.supabase.co) pour
      # DIRECT_URL : elle ne résout qu'en IPv6. Le mode session du 5432 relaie
      # les verrous consultatifs de `prisma migrate deploy`, ce que le mode
      # transaction du 6543 ne fait pas — et comme les migrations tournent au
      # démarrage, se tromper ici empêche l'API de démarrer, pas seulement de
      # migrer.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Générés par Render : deux secrets DISTINCTS, jamais le même.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Le tableau de bord est la SEULE origine web autorisée à appeler l'API.
      # Le mobile n'envoie pas d'en-tête `Origin` : il n'est pas concerné.
      # Render fournit l'hôte SANS schéma ; l'API complète le `https://`
      # manquant (api/src/config/env.ts).
      # ⚠️ NE PAS utiliser `fromService` / `property: host` ici : chez Render, cette
      # propriété renvoie le nom d'hôte INTERNE (réseau privé entre services,
      # ex. « hadjchanges-admin » seul), pas le domaine public en .onrender.com.
      # Constaté en le déployant : le tableau de bord échouait avec
      # « API injoignable (https://hadjchanges-api) », suffixe manquant. Le nom
      # de service étant fixé ci-dessous (`name: hadjchanges-admin`), l'adresse
      # publique est déterministe tant qu'aucun domaine personnalisé n'est ajouté.
      - key: CORS_ORIGINS
        value: https://hadjchanges-admin.onrender.com
      # Stockage des pièces d'identité et des reçus — voir le point 3.
      # ⚠️ `sync: false` et non une valeur figée : sinon toute modification faite
      # dans l'interface Render serait ÉCRASÉE à la prochaine synchronisation du
      # Blueprint — on repasserait en `s3` sans les clés, et le service
      # retomberait en échec sans qu'on comprenne pourquoi.
      #   `local` = disque du conteneur, EFFACÉ à chaque redéploiement.
      #   `s3`    = Cloudflare R2, seul choix viable pour de vrais clients.
      - key: STORAGE_DRIVER
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Courriel sortant — un vrai relais (Brevo, SendGrid, Mailgun…).
      # ⚠️ Mailtrap distingue DEUX serveurs : `sandbox.smtp.mailtrap.io`
      # CAPTURE les messages sans jamais les livrer (bac à sable), tandis que
      # `live.smtp.mailtrap.io` envoie réellement. Mettre le sandbox ici ferait
      # croire que tout fonctionne alors qu'aucun client ne recevrait rien.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: HadjChanges <no-reply@hadjchanges.ci>
      # Notifications WhatsApp / SMS : facultatives, l'API démarre sans.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

  # ──────────────────────────────────────────────────── tableau de bord ──
  - type: web
    name: hadjchanges-admin
    runtime: docker
    dockerfilePath: ./admin/Dockerfile
    dockerContext: ./admin
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      # ⚠️ Figée à la CONSTRUCTION (variable NEXT_PUBLIC_*), pas au démarrage :
      # changer cette valeur exige de RECONSTRUIRE le service, pas seulement de
      # le redémarrer.
      # ⚠️ Même piège que CORS_ORIGINS ci-dessus, et c'est celui-ci qui a été
      # observé en premier : NEXT_PUBLIC_API_URL valait « hadjchanges-api » sans
      # suffixe, figé dans le bundle du navigateur à la CONSTRUCTION — une
      # correction dans Render ne suffit pas seule, il faut reconstruire l'image
      # (Manual Deploy → Clear build cache & deploy).
      - key: NEXT_PUBLIC_API_URL
        value: https://hadjchanges-api.onrender.com
