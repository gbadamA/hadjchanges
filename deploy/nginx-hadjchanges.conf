# HadjChanges derrière le nginx DÉJÀ en place sur le VPS.
#
# Ce serveur héberge aussi PREVENTIX 360 : on n'ajoute que deux blocs, sans
# jamais toucher aux fichiers existants.
#
#   sudo cp nginx-hadjchanges.conf /etc/nginx/sites-available/hadjchanges
#   sudo ln -s /etc/nginx/sites-available/hadjchanges /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ `nginx -t` AVANT le rechargement, toujours : une erreur de syntaxe passée
# en force ferait tomber TOUS les sites du serveur, PREVENTIX compris.
#
# Le TLS s'ajoute ensuite, sans éditer ce fichier à la main :
#   sudo certbot --nginx -d api-change.preventic-afric.com -d change.preventic-afric.com

# ─────────────────────────────────────────────────────────────────── API ──
server {
    listen 80;
    server_name api-change.preventic-afric.com;

    # Les pièces d'identité et reçus transitent par ici ; la valeur par défaut
    # (1 Mo) rejetterait une photo de CNI prise au téléphone.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;

        # ⚠️ CES DEUX LIGNES PORTENT LE SUIVI EN TEMPS RÉEL. Sans elles, nginx
        # refuse la bascule en WebSocket : l'application se connecte, ne reçoit
        # jamais rien, et l'écran du client reste figé pendant que l'opérateur
        # valide son reçu. Aucune erreur nulle part — le pire cas de figure.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un WebSocket inactif ne doit pas être coupé au bout d'une minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ──────────────────────────────────────────────────── tableau de bord ──
server {
    listen 80;
    server_name change.preventic-afric.com;

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
