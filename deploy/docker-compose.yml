# Déploiement HadjChanges sur un VPS.
#
#   cd deploy && cp .env.example .env && nano .env && docker compose up -d
#
# Caddy termine le TLS et obtient les certificats Let's Encrypt tout seul. Il
# n'y a donc RIEN à renouveler à la main — un certificat expiré coupe une
# application mobile sans le moindre message côté serveur.
#
# ⚠️ UN NOM DE DOMAINE EST OBLIGATOIRE. Let's Encrypt ne certifie pas une adresse
# IP. Sans domaine, l'API resterait en http, et l'application mobile refuserait
# de s'y connecter — le trafic en clair y étant désormais interdit. Faire
# pointer deux enregistrements A vers l'IP du VPS AVANT le premier démarrage :
# Caddy demande les certificats immédiatement et échoue si le DNS ne résout pas.

services:
  # ────────────────────────────────────────────── base de données ──
  db:
    # Même version majeure qu'en développement : une différence de majeure
    # change des comportements subtils (tri, types), et on ne le découvre qu'en
    # production, sur des données réelles.
    image: postgres:16-alpine
    container_name: hadjchanges-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hadjchanges}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hadjchanges}
    # ⚠️ AUCUN `ports:` — la base n'est joignable que depuis le réseau interne
    # de Docker. Publier 5432 exposerait la base du bureau de change à
    # l'Internet entier, où les balayages de mots de passe sont permanents.
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sauvegardes:/sauvegardes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hadjchanges}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────── entrée HTTPS ──
  caddy:
    image: caddy:2-alpine
    container_name: hadjchanges-caddy
    restart: unless-stopped
    # ⚠️ Ne démarre QUE sur demande : `docker compose --profile caddy up -d`.
    # Sur un serveur qui a déjà nginx ou Apache, Caddy ne peut pas prendre les
    # ports 80/443 — et les libérer pour lui couperait le site existant.
    profiles: ["caddy"]
    ports:
      - "80:80" # requis par Let's Encrypt pour la validation
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats DOIVENT survivre à un redémarrage : sans ce volume,
      # chaque `docker compose up` en redemanderait, et Let's Encrypt limite à
      # 5 échecs par heure et par domaine — de quoi se bloquer soi-même.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAINE_API: ${DOMAINE_API}
      DOMAINE_ADMIN: ${DOMAINE_ADMIN}
    depends_on: [api, admin]

  # ──────────────────────────────────────────────────────────── API ──
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: hadjchanges-api
    restart: unless-stopped
    # ⚠️ `127.0.0.1:` en préfixe, ce n'est PAS décoratif : sans lui, Docker
    # ouvre le port sur TOUTES les interfaces et perce le pare-feu (ufw ne voit
    # pas passer les règles que Docker écrit lui-même dans iptables). L'API
    # serait alors joignable en clair depuis Internet, TLS contourné.
    ports:
      - "127.0.0.1:3061:3061"
    expose: ["3061"]
    # `service_healthy` et non `service_started` : Postgres accepte les
    # connexions bien après le démarrage du conteneur. Sans cette attente, les
    # migrations partent trop tôt et l'API meurt au premier lancement.
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3061
      # Base LOCALE : pas de pooleur, donc `DIRECT_URL` est la même adresse.
      # (La distinction n'a de sens que face à un pgBouncer, comme chez Neon.)
      DATABASE_URL: postgresql://${POSTGRES_USER:-hadjchanges}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hadjchanges}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-hadjchanges}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hadjchanges}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: https://${DOMAINE_ADMIN}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-HadjChanges <no-reply@hadjchanges.ci>}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3061/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Les migrations tournent au démarrage : laisser le temps avant de juger.
      start_period: 90s

  # ─────────────────────────────────────────────── tableau de bord ──
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        # ⚠️ Figée à la CONSTRUCTION (variable NEXT_PUBLIC_*). La changer exige
        # `docker compose build admin`, un simple redémarrage ne suffit PAS.
        NEXT_PUBLIC_API_URL: https://${DOMAINE_API}
    container_name: hadjchanges-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3060:3060"
    expose: ["3060"]
    environment:
      NODE_ENV: production

volumes:
  db-data:
  caddy-data:
  caddy-config:
